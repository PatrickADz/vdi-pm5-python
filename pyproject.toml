[project]
name = "vdi-pm5"
version = "1.2.0"
description = "Python driver for the VDI Erickson PM5 power meter (mm/submm)"
authors = [{ name = "PatrickADz" }]
requires-python = ">=3.8"
dependencies = ["pyserial>=3.5", "h5py>=3.0", "numpy>=1.20", "ruamel.yaml>=0.17"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]

[project.scripts]
vdi-pm5 = "vdi_pm5.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
